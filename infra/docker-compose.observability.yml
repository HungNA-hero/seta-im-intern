services:
  access-core:
    environment:
      METRICS_ENABLED: "true"
    labels:
      seta.observability.scrape: "true"
      seta.observability.service: "access-core"

  asset-core:
    environment:
      METRICS_ENABLED: "true"
    labels:
      seta.observability.scrape: "true"
      seta.observability.service: "asset-core"

  asset-delete-worker:
    environment:
      METRICS_ENABLED: "true"
    labels:
      seta.observability.scrape: "true"
      seta.observability.service: "asset-delete-worker"

  redis-exporter:
    image: oliver006/redis_exporter:v1.87.0
    profiles: ["observability"]
    container_name: ${SETA_COMPOSE_PREFIX:-seta}-redis-exporter
    command:
      - --redis.addr=redis://redis:6379
      - --check-single-streams=stream:asset-events,stream:asset-events:dlq
      - --streams-exclude-consumer-metrics
    ports:
      - "${REDIS_EXPORTER_PORT:-9121}:9121"

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["observability"]
    container_name: ${SETA_COMPOSE_PREFIX:-seta}-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/event-model.rules.yml:/etc/prometheus/event-model.rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - access-core
      - asset-core
      - asset-delete-worker
      - redis-exporter

  loki:
    image: grafana/loki:3.2.1
    profiles: ["observability"]
    container_name: ${SETA_COMPOSE_PREFIX:-seta}-loki
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./observability/loki/config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"

  alloy:
    image: grafana/alloy:v1.18.0
    profiles: ["observability"]
    container_name: ${SETA_COMPOSE_PREFIX:-seta}-alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    ports:
      - "${ALLOY_PORT:-12345}:12345"
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.3.0
    profiles: ["observability"]
    container_name: ${SETA_COMPOSE_PREFIX:-seta}-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
      - loki

volumes:
  prometheus_data:
  loki_data:
  alloy_data:
  grafana_data:
