name: seta-dam

services:
  asset-db:
    image: postgres:16-alpine
    container_name: ${SETA_COMPOSE_PREFIX:-seta}-asset-db
    environment:
      POSTGRES_DB: ${ASSET_DB_NAME:-asset_db}
      POSTGRES_USER: ${ASSET_DB_USER:-asset_user}
      POSTGRES_PASSWORD: ${ASSET_DB_PASSWORD:-asset_password}
    ports:
      - "${ASSET_DB_PORT:-5433}:5432"
    volumes:
      - asset_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default
      - media-internal

  access-db:
    image: postgres:16-alpine
    container_name: ${SETA_COMPOSE_PREFIX:-seta}-access-db
    environment:
      POSTGRES_DB: ${ACCESS_DB_NAME:-access_db}
      POSTGRES_USER: ${ACCESS_DB_USER:-access_user}
      POSTGRES_PASSWORD: ${ACCESS_DB_PASSWORD:-access_password}
    ports:
      - "${ACCESS_DB_PORT:-5434}:5432"
    volumes:
      - access_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  flyway-asset:
    image: flyway/flyway:10-alpine
    profiles: ["migration"]
    depends_on:
      asset-db:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://asset-db:5432/${ASSET_DB_NAME:-asset_db}
      FLYWAY_USER: ${ASSET_DB_USER:-asset_user}
      FLYWAY_PASSWORD: ${ASSET_DB_PASSWORD:-asset_password}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_POSTGRESQL_TRANSACTIONAL_LOCK: "false"
    volumes:
      - ./db/asset/migrations:/flyway/sql:ro
    command: -connectRetries=60 migrate

  flyway-access:
    image: flyway/flyway:10-alpine
    profiles: ["migration"]
    depends_on:
      access-db:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://access-db:5432/${ACCESS_DB_NAME:-access_db}
      FLYWAY_USER: ${ACCESS_DB_USER:-access_user}
      FLYWAY_PASSWORD: ${ACCESS_DB_PASSWORD:-access_password}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    volumes:
      - ./db/access/migrations:/flyway/sql:ro
    command: -connectRetries=60 migrate

  access-core:
    build:
      context: ../services/access-core
      target: prod
    container_name: ${SETA_COMPOSE_PREFIX:-seta}-access-core
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      ACCESS_DB_HOST: access-db
      ACCESS_DB_PORT: 5432
      ACCESS_DB_NAME: ${ACCESS_DB_NAME:-access_db}
      ACCESS_DB_USER: ${ACCESS_DB_USER:-access_user}
      ACCESS_DB_PASSWORD: ${ACCESS_DB_PASSWORD:-access_password}
      GO_ASSET_URL: http://asset-core:8080
      ASSET_INTERNAL_API_TOKEN: ${ASSET_INTERNAL_API_TOKEN:-seta-dam-local-development-token}
      ACCESS_MEDIA_UPLOAD_ENABLED: ${ACCESS_MEDIA_UPLOAD_ENABLED:-false}
      ACCESS_MEDIA_SESSION_LIMIT_PER_USER_PER_MINUTE: ${ACCESS_MEDIA_SESSION_LIMIT_PER_USER_PER_MINUTE:-10}
      ACCESS_MEDIA_SESSION_LIMIT_PER_ORG_PER_MINUTE: ${ACCESS_MEDIA_SESSION_LIMIT_PER_ORG_PER_MINUTE:-60}
      ACCESS_MEDIA_BREAKER_ENABLED: ${ACCESS_MEDIA_BREAKER_ENABLED-true}
      ACCESS_MEDIA_FETCH_TIMEOUT_MS: ${ACCESS_MEDIA_FETCH_TIMEOUT_MS-60000}
      ACCESS_MEDIA_BREAKER_ERROR_THRESHOLD_PCT: ${ACCESS_MEDIA_BREAKER_ERROR_THRESHOLD_PCT-50}
      ACCESS_MEDIA_BREAKER_VOLUME_THRESHOLD: ${ACCESS_MEDIA_BREAKER_VOLUME_THRESHOLD-10}
      ACCESS_MEDIA_BREAKER_RESET_MS: ${ACCESS_MEDIA_BREAKER_RESET_MS-65000}
      ACCESS_MEDIA_BREAKER_CAPACITY: ${ACCESS_MEDIA_BREAKER_CAPACITY-50}
      ACCESS_ASSET_BREAKER_ENABLED: ${ACCESS_ASSET_BREAKER_ENABLED-true}
      ACCESS_ASSET_BREAKER_ERROR_THRESHOLD_PCT: ${ACCESS_ASSET_BREAKER_ERROR_THRESHOLD_PCT-50}
      ACCESS_ASSET_BREAKER_VOLUME_THRESHOLD: ${ACCESS_ASSET_BREAKER_VOLUME_THRESHOLD-10}
      ACCESS_ASSET_BREAKER_RESET_MS: ${ACCESS_ASSET_BREAKER_RESET_MS-5000}
      ACCESS_ASSET_BREAKER_CAPACITY: ${ACCESS_ASSET_BREAKER_CAPACITY-50}
      ACCESS_REDIS_HOST: redis
      ACCESS_REDIS_PORT: 6379
    ports:
      - "${NODE_ACCESS_CORE_PORT:-4000}:4000"
    depends_on:
      access-db:
        condition: service_healthy
      asset-core:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 15s

  asset-core:
    build:
      context: ../services/asset-core
      target: prod
    container_name: ${SETA_COMPOSE_PREFIX:-seta}-asset-core
    environment:
      PORT: 8080
      ASSET_DB_HOST: asset-db
      ASSET_DB_PORT: 5432
      ASSET_DB_NAME: ${ASSET_DB_NAME:-asset_db}
      ASSET_DB_USER: ${ASSET_DB_USER:-asset_user}
      ASSET_DB_PASSWORD: ${ASSET_DB_PASSWORD:-asset_password}
      ASSET_DB_SSLMODE: disable
      ASSET_INTERNAL_API_TOKEN: ${ASSET_INTERNAL_API_TOKEN:-seta-dam-local-development-token}
      ASSET_REDIS_HOST: redis
      ASSET_REDIS_PORT: 6379
      ASSET_KAFKA_BROKERS: kafka:9092
      ASSET_KAFKA_MEDIA_TOPIC: ${ASSET_KAFKA_MEDIA_TOPIC:-media-processing.v1}
      ASSET_KAFKA_MEDIA_DLQ_TOPIC: ${ASSET_KAFKA_MEDIA_DLQ_TOPIC:-media-processing-dlq.v1}
      ASSET_KAFKA_MEDIA_GROUP_ID: ${ASSET_KAFKA_MEDIA_GROUP_ID:-media-workers-v1}
      ASSET_MEDIA_BUCKET: ${ASSET_MEDIA_BUCKET:-seta-media}
      ASSET_MEDIA_S3_REGION: ${ASSET_MEDIA_S3_REGION:-us-east-1}
      # Containers reach MinIO internally; presigned URLs are signed against the
      # public endpoint and are never rewritten afterwards, so the two differ.
      ASSET_MEDIA_S3_INTERNAL_ENDPOINT: http://minio:9000
      ASSET_MEDIA_S3_PUBLIC_ENDPOINT: ${ASSET_MEDIA_S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      ASSET_MEDIA_S3_ACCESS_KEY_ID: ${ASSET_MEDIA_S3_ACCESS_KEY_ID:-seta-media-local}
      ASSET_MEDIA_S3_SECRET_ACCESS_KEY: ${ASSET_MEDIA_S3_SECRET_ACCESS_KEY:-seta-media-local-secret}
      ASSET_MEDIA_S3_USE_PATH_STYLE: "true"
      ASSET_MEDIA_REQUIRE_HTTPS: ${ASSET_MEDIA_REQUIRE_HTTPS:-false}
    ports:
      - "${GO_ASSET_CORE_PORT:-8080}:8080"
    depends_on:
      asset-db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    stop_grace_period: 15s

  asset-delete-worker:
    build:
      context: ../services/asset-core
      target: prod
    container_name: ${SETA_COMPOSE_PREFIX:-seta}-asset-delete-worker
    entrypoint: ["/app/asset-delete-worker"]
    environment:
      ASSET_DB_HOST: asset-db
      ASSET_DB_PORT: 5432
      ASSET_DB_NAME: ${ASSET_DB_NAME:-asset_db}
      ASSET_DB_USER: ${ASSET_DB_USER:-asset_user}
      ASSET_DB_PASSWORD: ${ASSET_DB_PASSWORD:-asset_password}
      ASSET_DB_SSLMODE: disable
      ASSET_REDIS_HOST: redis
      ASSET_REDIS_PORT: 6379
      ASSET_MEDIA_BUCKET: ${ASSET_MEDIA_BUCKET:-seta-media}
      ASSET_MEDIA_S3_REGION: ${ASSET_MEDIA_S3_REGION:-us-east-1}
      ASSET_MEDIA_S3_INTERNAL_ENDPOINT: http://minio:9000
      ASSET_MEDIA_S3_PUBLIC_ENDPOINT: ${ASSET_MEDIA_S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      ASSET_MEDIA_S3_ACCESS_KEY_ID: ${ASSET_MEDIA_S3_ACCESS_KEY_ID:-seta-media-local}
      ASSET_MEDIA_S3_SECRET_ACCESS_KEY: ${ASSET_MEDIA_S3_SECRET_ACCESS_KEY:-seta-media-local-secret}
      ASSET_MEDIA_S3_CHECKSUM_SUPPORTED: ${ASSET_MEDIA_S3_CHECKSUM_SUPPORTED:-true}
    depends_on:
      asset-db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    stop_grace_period: 15s
    # The worker has no HTTP listener; inheriting the Asset API healthcheck would
    # report a false unhealthy state even while the job loop is running.
    healthcheck:
      disable: true

  asset-retention-scheduler:
    build:
      context: ../services/asset-core
      target: prod
    container_name: ${SETA_COMPOSE_PREFIX:-seta}-asset-retention-scheduler
    entrypoint: ["/app/asset-retention-scheduler"]
    environment:
      ASSET_DB_HOST: asset-db
      ASSET_DB_PORT: 5432
      ASSET_DB_NAME: ${ASSET_DB_NAME:-asset_db}
      ASSET_DB_USER: ${ASSET_DB_USER:-asset_user}
      ASSET_DB_PASSWORD: ${ASSET_DB_PASSWORD:-asset_password}
      ASSET_DB_SSLMODE: disable
      ASSET_RETENTION_CLEANUP_TIMEZONE: ${ASSET_RETENTION_CLEANUP_TIMEZONE:-Asia/Bangkok}
    depends_on:
      asset-db:
        condition: service_healthy
    stop_grace_period: 15s
    healthcheck:
      disable: true

  media-worker:
    build:
      context: ../services/asset-core
      target: prod
    container_name: ${SETA_COMPOSE_PREFIX:-seta}-media-worker
    entrypoint: ["/app/media-worker"]
    environment:
      ASSET_DB_HOST: asset-db
      ASSET_DB_PORT: 5432
      ASSET_DB_NAME: ${ASSET_DB_NAME:-asset_db}
      ASSET_DB_USER: ${ASSET_DB_USER:-asset_user}
      ASSET_DB_PASSWORD: ${ASSET_DB_PASSWORD:-asset_password}
      ASSET_DB_SSLMODE: disable
      ASSET_KAFKA_BROKERS: kafka:9092
      ASSET_KAFKA_MEDIA_TOPIC: ${ASSET_KAFKA_MEDIA_TOPIC:-media-processing.v1}
      ASSET_KAFKA_MEDIA_DLQ_TOPIC: ${ASSET_KAFKA_MEDIA_DLQ_TOPIC:-media-processing-dlq.v1}
      ASSET_KAFKA_MEDIA_GROUP_ID: ${ASSET_KAFKA_MEDIA_GROUP_ID:-media-workers-v1}
      ASSET_MEDIA_BUCKET: ${ASSET_MEDIA_BUCKET:-seta-media}
      ASSET_MEDIA_S3_REGION: ${ASSET_MEDIA_S3_REGION:-us-east-1}
      ASSET_MEDIA_S3_INTERNAL_ENDPOINT: http://minio:9000
      ASSET_MEDIA_S3_PUBLIC_ENDPOINT: ${ASSET_MEDIA_S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      ASSET_MEDIA_S3_ACCESS_KEY_ID: ${ASSET_MEDIA_S3_ACCESS_KEY_ID:-seta-media-local}
      ASSET_MEDIA_S3_SECRET_ACCESS_KEY: ${ASSET_MEDIA_S3_SECRET_ACCESS_KEY:-seta-media-local-secret}
      ASSET_MEDIA_REQUIRE_HTTPS: ${ASSET_MEDIA_REQUIRE_HTTPS:-false}
      ASSET_MEDIA_PROCESSOR_PATH: /usr/local/bin/media-processor
      ASSET_MEDIA_SCRATCH_DIR: /scratch
      ASSET_MEDIA_PROCESSOR_UID: 65532
      ASSET_MEDIA_PROCESSOR_GID: 65532
      ASSET_MEDIA_PROCESSOR_VALIDATION_SECONDS: ${ASSET_MEDIA_PROCESSOR_VALIDATION_SECONDS:-15}
      ASSET_MEDIA_PROCESSOR_TRANSFORM_SECONDS: ${ASSET_MEDIA_PROCESSOR_TRANSFORM_SECONDS:-60}
      ASSET_MEDIA_PROCESSOR_DEADLINE_SECONDS: ${ASSET_MEDIA_PROCESSOR_DEADLINE_SECONDS:-90}
      ASSET_MEDIA_SWEEP_INTERVAL_MINUTES: ${ASSET_MEDIA_SWEEP_INTERVAL_MINUTES:-15}
      ASSET_MEDIA_SWEEP_BATCH_SIZE: ${ASSET_MEDIA_SWEEP_BATCH_SIZE:-50}
    depends_on:
      asset-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    read_only: true
    user: "0:0"
    tmpfs:
      - /scratch:mode=0711,uid=0,gid=0,size=${ASSET_MEDIA_SCRATCH_SIZE:-512m},noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    restart: unless-stopped
    networks:
      - media-internal
    deploy:
      resources:
        limits:
          cpus: "${ASSET_MEDIA_WORKER_CPUS:-2.0}"
          memory: ${ASSET_MEDIA_WORKER_MEMORY:-1g}
          pids: ${ASSET_MEDIA_WORKER_PIDS:-128}
    stop_grace_period: 100s
    healthcheck:
      disable: true

  redis:
    image: redis:7-alpine
    container_name: ${SETA_COMPOSE_PREFIX:-seta}-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local development topology only: single private bucket, HTTP, bound to
  # localhost, with development-only root credentials. Anything beyond a
  # developer machine requires a supported MinIO distribution, TLS on both the
  # internal and public endpoints, and credentials issued outside this file.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: ${SETA_COMPOSE_PREFIX:-seta}-minio
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${ASSET_MEDIA_S3_ACCESS_KEY_ID:-seta-media-local}
      MINIO_ROOT_PASSWORD: ${ASSET_MEDIA_S3_SECRET_ACCESS_KEY:-seta-media-local-secret}
      # MinIO does not implement the S3 PutBucketCors API, so browser CORS is
      # server-level rather than a bucket policy. Unset would default to "*".
      MINIO_API_CORS_ALLOW_ORIGIN: ${ASSET_MEDIA_CORS_ALLOW_ORIGIN:-http://localhost:3000,http://localhost:4000}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - default
      - media-internal

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: ${SETA_COMPOSE_PREFIX:-seta}-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${ASSET_MEDIA_S3_ACCESS_KEY_ID:-seta-media-local}
      MINIO_ROOT_PASSWORD: ${ASSET_MEDIA_S3_SECRET_ACCESS_KEY:-seta-media-local-secret}
      MINIO_INTERNAL_ENDPOINT: http://minio:9000
      MEDIA_BUCKET: ${ASSET_MEDIA_BUCKET:-seta-media}
    volumes:
      - ./minio/init.sh:/etc/minio/init.sh:ro
    entrypoint: ["/bin/sh", "/etc/minio/init.sh"]
    restart: "no"

  # Local development topology only: single-node combined KRaft, replication
  # factor 1, PLAINTEXT, bound to localhost. Production requires at least three
  # brokers with replication factor 3, min.insync.replicas 2, and TLS+SASL —
  # see docs/kan-81-kafka-outbox-transport-seam.md.
  kafka:
    image: apache/kafka:4.2.1
    container_name: ${SETA_COMPOSE_PREFIX:-seta}-kafka
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-29092}:${KAFKA_HOST_PORT:-29092}"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,HOST://0.0.0.0:${KAFKA_HOST_PORT:-29092},CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:${KAFKA_HOST_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-5L6g3nShT-eMCtK--X86sw}
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      timeout: 10s
      retries: 20
    networks:
      - default
      - media-internal

  kafka-init:
    image: apache/kafka:4.2.1
    container_name: ${SETA_COMPOSE_PREFIX:-seta}-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      MEDIA_TOPIC: ${ASSET_KAFKA_MEDIA_TOPIC:-media-processing.v1}
      MEDIA_PARTITIONS: ${ASSET_KAFKA_MEDIA_PARTITIONS:-3}
      MEDIA_DLQ_TOPIC: ${ASSET_KAFKA_MEDIA_DLQ_TOPIC:-media-processing-dlq.v1}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --create --if-not-exists --topic "$$MEDIA_TOPIC" \
          --partitions "$$MEDIA_PARTITIONS" --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --create --if-not-exists --topic "$$MEDIA_DLQ_TOPIC" \
          --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
    restart: "no"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: ${SETA_COMPOSE_PREFIX:-seta}-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: ${SETA_COMPOSE_PREFIX:-seta}-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"

networks:
  default:
  media-internal:
    internal: true

volumes:
  asset_db_data:
  access_db_data:
  redis_data:
  kafka_data:
  minio_data:
