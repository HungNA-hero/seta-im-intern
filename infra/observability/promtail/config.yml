server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: seta-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_label_seta_observability_scrape]
        regex: "true"
        action: keep
      - source_labels: [__meta_docker_container_label_seta_observability_service]
        target_label: service
      - source_labels: [__meta_docker_container_name]
        target_label: container
    pipeline_stages:
      - docker: {}
      - json:
          expressions:
            service: service
            level: level
            result: result
      - labels:
          service:
          level:
          result:
