global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/event-model.rules.yml

scrape_configs:
  - job_name: access-core
    metrics_path: /metrics
    static_configs:
      - targets: [access-core:4000]
        labels:
          service: access-core

  - job_name: asset-core
    metrics_path: /metrics
    static_configs:
      - targets: [asset-core:8080]
        labels:
          service: asset-core

  - job_name: asset-delete-worker
    metrics_path: /metrics
    static_configs:
      - targets: [asset-delete-worker:8081]
        labels:
          service: asset-delete-worker

  - job_name: redis-exporter
    metrics_path: /metrics
    static_configs:
      - targets: [redis-exporter:9121]
